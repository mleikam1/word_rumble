name: Native gameplay verification

on:
  push:
    branches: [qa/native-emulators-218a247]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Pixel emulator (Android 14)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - name: Allow the runner to use Android hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run gameplay on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test --no-pub -d emulator-5554 --reporter expanded integration_test/native_gameplay_test.dart
  ios:
    name: iPhone simulator
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - name: Boot an available iPhone
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/iphones.json"
          python3 - "$RUNNER_TEMP/iphones.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path
          devices = json.loads(Path(sys.argv[1]).read_text())["devices"]
          options = []
          for runtime, phones in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(v) for v in runtime.split(".iOS-")[-1].split("-"))
              for phone in phones:
                  if phone.get("isAvailable") and phone["name"].startswith("iPhone"):
                      options.append(((version[0] == 18, version, phone["name"] == "iPhone 16", phone["name"]), phone, runtime))
          if not options:
              raise SystemExit("No available iPhone simulator is installed")
          _, phone, runtime = max(options, key=lambda option: option[0])
          print("Selected", phone["name"], runtime, phone["udid"])
          with open(sys.argv[2], "a", encoding="utf8") as out:
              print("IOS_TEST_UDID=" + phone["udid"], file=out)
          PY
      - name: Run gameplay on iOS
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$IOS_TEST_UDID" -b
          flutter pub get
          flutter devices
          flutter test --no-pub -d "$IOS_TEST_UDID" --reporter expanded integration_test/native_gameplay_test.dart
